name: Daily Outreach — ByteVision Reelworks

on:
  schedule:
    - cron: '0 12 * * 1'      # Monday 7:00am CDT — find new leads first
    - cron: '0 13 * * 1-5'   # Mon–Fri 8:00am CDT — send emails
  workflow_dispatch:           # Manual trigger from GitHub website anytime

jobs:
  # ── Runs every Monday: search Yelp, scrape websites, save new leads ──────
  find-leads:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '0 12'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/setup-business-playbook-MNpJc
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv -q

      - name: Create .env
        run: |
          printf 'YELP_API_KEY=%s\nANTHROPIC_API_KEY=%s\nGMAIL_USER=%s\nGMAIL_APP_PASSWORD=%s\nIMAP_HOST=imap.gmail.com\nIMAP_PORT=993\n' \
            "${{ secrets.YELP_API_KEY }}" \
            "${{ secrets.ANTHROPIC_API_KEY }}" \
            "${{ secrets.GMAIL_USER }}" \
            "${{ secrets.GMAIL_APP_PASSWORD }}" \
            > cold-outreach/.env

      - name: Find new leads
        run: cd cold-outreach/scripts && python find_leads.py --limit 25 || true

      - name: Save new leads to repo
        run: |
          git config user.name "ByteVision Bot"
          git config user.email "bytevisionreelworks@gmail.com"
          git add cold-outreach/data/raw/ || true
          git diff --staged --quiet || git commit -m "Auto: new leads $(date +%Y-%m-%d)"
          git push

  # ── Runs Mon–Fri: detect replies, follow-ups, score, draft, send ──────────
  send-emails:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '0 13'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/setup-business-playbook-MNpJc
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests beautifulsoup4 imap-tools python-dotenv -q

      - name: Create .env
        run: |
          printf 'YELP_API_KEY=%s\nANTHROPIC_API_KEY=%s\nGMAIL_USER=%s\nGMAIL_APP_PASSWORD=%s\nIMAP_HOST=imap.gmail.com\nIMAP_PORT=993\n' \
            "${{ secrets.YELP_API_KEY }}" \
            "${{ secrets.ANTHROPIC_API_KEY }}" \
            "${{ secrets.GMAIL_USER }}" \
            "${{ secrets.GMAIL_APP_PASSWORD }}" \
            > cold-outreach/.env

      - name: Detect replies
        run: cd cold-outreach/scripts && python detect_replies.py || true

      - name: Send follow-ups
        run: cd cold-outreach/scripts && python follow_up.py --yes || true

      - name: Score leads
        run: cd cold-outreach/scripts && python score_leads.py

      - name: Draft new emails
        run: cd cold-outreach/scripts && python draft_emails.py --grade A --limit 20 || true

      - name: Send emails
        run: cd cold-outreach/scripts && python send_emails.py --limit 15 --yes

      - name: Save state back to repo
        run: |
          git config user.name "ByteVision Bot"
          git config user.email "bytevisionreelworks@gmail.com"
          git add cold-outreach/data/scored/ cold-outreach/logs/ cold-outreach/drafts/ || true
          git diff --staged --quiet || git commit -m "Auto: outreach run $(date +%Y-%m-%d)"
          git push
